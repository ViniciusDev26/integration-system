# Local development environment (ADR 0021, ADR 0029). NOT a production deployment
# mechanism. One command brings up everything:
#
#   docker compose up            # postgres + migrations + running API
#
# Requires a `.env` at the repo root (copy `.env.example`) — it carries the
# GitHub OAuth + storage secrets. DATABASE_URL is provided here, pointing at the
# `postgres` service, so it need not be in your `.env`.
#
# The app is the API workspace (apps/api). Build context is the repo ROOT so the
# workspace manifests + lockfile are available to the image's `npm ci`.
#
# After changing dependencies, rebuild the image AND refresh the container-built
# node_modules:
#
#   docker compose up --build -V   # -V renews the anon node_modules; keeps pgdata

# Shared config for the app-image services (app + migrate): both build the
# Dockerfile `dev` stage and bind-mount the repo. node_modules are ANONYMOUS
# volumes so the container uses its own (musl-built) dependencies rather than the
# host's, and `-V` on `up` re-seeds them from a freshly built image.
x-app-dev: &app-dev
  build:
    context: .
    target: dev
  image: integration-system-app-dev
  env_file: .env
  volumes:
    - .:/app
    - /app/node_modules
    - /app/apps/api/node_modules
    - /app/apps/web/node_modules

services:
  postgres:
    image: postgres:18-alpine
    container_name: integration-system-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: integration_system
    ports:
      - "5432:5432"
    volumes:
      # PG18 images store data in a subdirectory of this mount (not the mount
      # root); mounting at /var/lib/postgresql/data fails to initialize.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d integration_system"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: apply Drizzle migrations once Postgres is healthy, then exit.
  migrate:
    <<: *app-dev
    container_name: integration-system-migrate
    command: ["npm", "run", "db:migrate", "-w", "@integration-system/api"]
    environment:
      DATABASE_URL: postgres://user:password@postgres:5432/integration_system
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # The API, with hot reload (tsc-watch). Waits for migrations to finish.
  app:
    <<: *app-dev
    container_name: integration-system-app
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://user:password@postgres:5432/integration_system
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
